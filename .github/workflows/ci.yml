name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  linting:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: 2. HTMLHint
        run: npm run lint:html

      - name: 3. Stylelint
        run: npm run lint:css

  build:
    name: Build Website
    runs-on: ubuntu-latest
    needs: linting
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: 4. Build Website using Parcel
        run: npm run build

      - name: Upload dist folder
        uses: actions/upload-artifact@v4
        with:
          name: parcel-dist
          path: dist/

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    # Only push Docker image on merge/push to develop or main branches, adjust if needed
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: Download dist folder
        uses: actions/download-artifact@v4
        with:
          name: parcel-dist
          path: dist/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.MINAHIL_MUSTAFA}}
          password: ${{ secrets.MINAHIL_MUSTAFA_TOKEN }}

      - name: 5. Build Docker Image using Dockerfile
        run: docker build -t ${{ secrets.MINAHIL_MUSTAFA }}/uni-notice-board:latest .

      - name: 6. Push Docker Image to Docker Hub
        run: docker push ${{ secrets.MINAHIL_MUSTAFA }}/uni-notice-board:latest
